name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/satel_sia/manifest.json > m.json
          mv m.json custom_components/satel_sia/manifest.json
      - name: Zip integration
        run: cd custom_components/satel_sia && zip -r ../../satel_sia.zip . -x '*/__pycache__/*'
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" satel_sia.zip --clobber
